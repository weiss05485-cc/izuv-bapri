<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>עיצוב בפרי — מערכת ניהול</title>
<style>
:root {
  --green-light: #9BBF3A;
  --green-mid:   #6B8F2A;
  --green-dark:  #3E5C1A;
  --gold:        #B89A28;
  --gold-light:  #D4B84A;
  --bg:          #F7F9F2;
  --bg-card:     #FFFFFF;
  --text:        #2A2A2A;
  --text-muted:  #6B7A5A;
  --border:      #D4E0B0;
  --red:         #C0392B;
  --orange:      #E67E22;
  --blue:        #2980B9;
  --shadow:      0 2px 12px rgba(60,80,20,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ===== SIDEBAR ===== */
#sidebar {
  position: fixed; right: 0; top: 0; width: 220px; height: 100vh;
  background: linear-gradient(180deg, var(--green-dark) 0%, var(--green-mid) 100%);
  display: flex; flex-direction: column; z-index: 100; box-shadow: -2px 0 12px rgba(0,0,0,0.15);
}
#sidebar .logo { padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; gap: 10px; }
#sidebar .logo img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; background: white; padding: 3px; }
#sidebar .logo span { color: var(--gold-light); font-size: 16px; font-weight: 700; }
#sidebar nav { flex: 1; padding: 12px 0; overflow-y: auto; }
#sidebar nav a {
  display: flex; align-items: center; gap: 10px; padding: 11px 18px;
  color: rgba(255,255,255,0.85); text-decoration: none; font-size: 14px; cursor: pointer;
  transition: background 0.15s, color 0.15s; border-right: 3px solid transparent;
}
#sidebar nav a:hover { background: rgba(255,255,255,0.1); color: white; }
#sidebar nav a.active { background: rgba(255,255,255,0.15); color: white; border-right-color: var(--gold-light); font-weight: 600; }
#sidebar nav a .icon { font-size: 18px; width: 22px; text-align: center; }
#sidebar .version { padding: 12px 18px; color: rgba(255,255,255,0.4); font-size: 11px; }

/* ===== MAIN ===== */
#main { margin-right: 220px; min-height: 100vh; display: flex; flex-direction: column; }
#topbar {
  background: white; border-bottom: 1px solid var(--border); padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
#topbar h1 { font-size: 20px; font-weight: 700; color: var(--green-dark); }
#topbar .topbar-actions { display: flex; gap: 10px; align-items: center; }
#content { flex: 1; padding: 28px; }

/* ===== CARDS / PANELS ===== */
.card { background: var(--bg-card); border-radius: 12px; box-shadow: var(--shadow); padding: 22px; margin-bottom: 20px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.card-header h2 { font-size: 17px; font-weight: 700; color: var(--green-dark); }

/* ===== DASHBOARD ===== */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: white; border-radius: 12px; padding: 18px 20px;
  box-shadow: var(--shadow); border-top: 4px solid var(--green-light);
  display: flex; flex-direction: column; gap: 6px;
}
.stat-card.gold { border-top-color: var(--gold); }
.stat-card.red  { border-top-color: var(--red); }
.stat-card.blue { border-top-color: var(--blue); }
.stat-card .label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
.stat-card .value { font-size: 28px; font-weight: 800; color: var(--green-dark); }
.stat-card.gold .value { color: var(--gold); }
.stat-card.red  .value { color: var(--red); }
.stat-card.blue .value { color: var(--blue); }

/* ===== TABLES ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { background: var(--green-dark); color: white; padding: 11px 14px; text-align: right; font-weight: 600; font-size: 13px; }
th:first-child { border-radius: 0 8px 0 0; }
th:last-child  { border-radius: 8px 0 0 0; }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
tr:hover td { background: #F0F6E8; }
tr:last-child td { border-bottom: none; }

/* ===== BADGES ===== */
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
}
.badge-green  { background: #E8F5D0; color: var(--green-dark); }
.badge-gold   { background: #FDF3D0; color: #7A6010; }
.badge-red    { background: #FDECEA; color: var(--red); }
.badge-blue   { background: #EAF4FB; color: var(--blue); }
.badge-gray   { background: #F0F0F0; color: #666; }
.badge-orange { background: #FEF0E6; color: #7A3A10; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px;
  border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none;
  transition: background 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--green-mid); color: white; }
.btn-primary:hover { background: var(--green-dark); }
.btn-gold { background: var(--gold); color: white; }
.btn-gold:hover { background: #9A8010; }
.btn-outline { background: white; color: var(--green-mid); border: 1.5px solid var(--green-mid); }
.btn-outline:hover { background: var(--green-mid); color: white; }
.btn-red { background: var(--red); color: white; }
.btn-red:hover { background: #922B21; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* ===== FORMS ===== */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.form-grid.wide { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 13px; font-weight: 600; color: var(--green-dark); }
.field input, .field select, .field textarea {
  padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s;
  background: white; color: var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--green-mid);
}
.field textarea { resize: vertical; min-height: 70px; }
.section-title {
  font-size: 15px; font-weight: 700; color: var(--green-mid);
  border-bottom: 2px solid var(--border); padding-bottom: 8px; margin: 20px 0 14px;
  grid-column: 1 / -1;
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: white; border-radius: 16px; padding: 28px; max-width: 780px; width: 100%;
  max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,0.25);
  position: relative;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.modal-header h2 { font-size: 18px; font-weight: 700; color: var(--green-dark); }
.modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-muted); }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ===== WORK SCREEN ===== */
.work-table th { font-size: 13px; }
.work-table td { vertical-align: middle; }
.check-cell { text-align: center; }
.check-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 2px solid var(--border);
  background: white; cursor: pointer; font-size: 16px; transition: all 0.15s;
  display: inline-flex; align-items: center; justify-content: center;
}
.check-btn.taken   { background: var(--gold); border-color: var(--gold); color: white; }
.check-btn.done    { background: var(--green-mid); border-color: var(--green-mid); color: white; }
.check-btn:hover   { transform: scale(1.1); }

/* ===== STICKER ===== */
.sticker-print {
  background: white; border: 2px dashed var(--green-mid); border-radius: 8px;
  padding: 14px 18px; font-size: 13px; min-width: 180px;
  display: inline-flex; flex-direction: column; gap: 4px;
}
.sticker-print .st-title { font-size: 11px; color: var(--text-muted); font-weight: 600; }
.sticker-print .st-val   { font-size: 15px; font-weight: 700; color: var(--green-dark); }

/* ===== SEARCH BAR ===== */
.search-bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.search-bar input { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; min-width: 200px; }
.search-bar input:focus { border-color: var(--green-mid); }

/* ===== TABS ===== */
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
.tab { padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab.active { color: var(--green-dark); border-bottom-color: var(--green-mid); }
.tab:hover { color: var(--green-dark); }

/* ===== PAYMENT STATUS ===== */
.pay-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.pay-row:last-child { border-bottom: none; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #f0f0f0; }
::-webkit-scrollbar-thumb { background: var(--green-light); border-radius: 3px; }

/* ===== PRINT ===== */
@media print {
  #sidebar, #topbar, .btn, .no-print { display: none !important; }
  #main { margin-right: 0; }
  body { background: white; }
}

/* ===== MOBILE ===== */
.hamburger {
  display: none; background: none; border: none; cursor: pointer;
  flex-direction: column; gap: 5px; padding: 4px;
}
.hamburger span {
  display: block; width: 24px; height: 2px;
  background: var(--green-dark); border-radius: 2px; transition: all 0.3s;
}
.sidebar-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 90;
}
.sidebar-overlay.active { display: block; }

@media (max-width: 768px) {
  #sidebar {
    position: fixed; right: -220px; top: 0; height: 100vh;
    transition: right 0.3s ease; z-index: 100;
  }
  #sidebar.open { right: 0; }
  #main { margin-right: 0; }
  #topbar { padding: 12px 16px; }
  #topbar h1 { font-size: 16px; }
  #content { padding: 14px; }
  .hamburger { display: flex; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card .value { font-size: 22px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid.wide { grid-template-columns: 1fr; }
  table { font-size: 12px; }
  th, td { padding: 8px 10px; }
  .btn { padding: 8px 14px; font-size: 13px; }
  .card { padding: 14px; }
  div[style*="grid-template-columns:1fr 1fr"],
  div[style*="grid-template-columns:2fr 1fr"] {
    grid-template-columns: 1fr !important;
  }
  .modal { padding: 18px; margin: 10px; }
  #sidebar .logo span { font-size: 15px; }
}

/* ===== WORK SCREEN FULLSCREEN ===== */
.work-fullscreen #sidebar,
.work-fullscreen #topbar { display: none; }
.work-fullscreen #main { margin-right: 0; }
.work-fullscreen #content { padding: 16px; }

/* ===== DELIVERY LABEL ===== */
.delivery-label {
  border: 2px solid var(--green-dark); border-radius: 10px; padding: 16px 20px;
  background: white; max-width: 340px; font-size: 13px;
}
.delivery-label .dl-header { text-align: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.delivery-label .dl-logo { font-size: 20px; font-weight: 800; color: var(--green-dark); }
.delivery-label .dl-row { display: flex; gap: 8px; padding: 3px 0; }
.delivery-label .dl-key { color: var(--text-muted); min-width: 80px; font-size: 12px; }
.delivery-label .dl-val { font-weight: 600; }

/* ===== COLLECTION TRACKER ===== */
.collect-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; background: #FFFEF7; border: 1px solid var(--border); margin-bottom: 8px; }
.collect-row:hover { background: #F0F6E8; }
.collect-row .cr-name { font-weight: 700; min-width: 130px; }
.collect-row .cr-amt  { font-size: 16px; font-weight: 800; color: var(--green-dark); min-width: 90px; }
.collect-row .cr-actions { display: flex; gap: 6px; margin-right: auto; }

/* ===== TOAST ===== */
#toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--green-dark); color: white; padding: 12px 28px; border-radius: 30px;
  font-size: 14px; font-weight: 600; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
#toast.show { opacity: 1; }
</style>

// ===================== HELPERS =====================
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function genOrderNum() {
  return 'HF-' + DB.nextId;
}

function statusLabel(s) {
  const map = { 'waiting': ['ממתין','badge-gold'], 'in-progress': ['בעבודה','badge-blue'], 'done': ['בוצע','badge-green'], 'closed': ['סגור','badge-gray'], 'hesitant': ['מתלבט','badge-orange'], 'not-interested': ['לא מעוניין','badge-red'] };
  return map[s] || [s, 'badge-gray'];
}

function payLabel(s) {
  const map = { 'paid': ['שולם','badge-green'], 'pending': ['ממתין','badge-gold'], 'partial': ['חלקי','badge-orange'] };
  return map[s] || [s, 'badge-gray'];
}

function payMethodLabel(m) {
  const map = { credit: 'אשראי', cash: 'מזומן', transfer: 'העברה בנקאית', check: "צ'ק", institutional: 'מוסדי' };
  return map[m] || m;
}

function formatDate(d) {
  if (!d) return '';
  const parts = d.split('-');
  if (parts.length === 3) return parts[2]+'/'+parts[1]+'/'+parts[0];
  return d;
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const ADMIN_PASSWORD = '12341234';
// העמודים שהמזכירה רואה (מנהל רואה הכל):
const SECRETARY_PAGES = ['orders','new-order','customers','work'];
let userRole = localStorage.getItem('izuv_role') || 'secretary';

function canSee(page) { return userRole === 'admin' || SECRETARY_PAGES.indexOf(page) !== -1; }

function applyRoleToNav() {
  document.querySelectorAll('#nav a').forEach(a => {
    a.style.display = canSee(a.dataset.page) ? '' : 'none';
  });
}

function renderTopbar() {
  const ta = document.getElementById('topbar-actions');
  if (!ta) return;
  let html = `<button class="btn btn-outline btn-sm" onclick="loadFromGoogleSheets()" title="טען מ-Google Sheets">🔄 סנכרן</button>`;
  if (userRole === 'admin')
    html += ` <button class="btn btn-outline btn-sm" onclick="exitAdmin()">👤 יציאה ממצב מנהל</button>`;
  else
    html += ` <button class="btn btn-gold btn-sm" onclick="adminLogin()">🔑 כניסת מנהל</button>`;
  ta.innerHTML = html;
}

function adminLogin() {
  const p = prompt('סיסמת מנהל:');
  if (p === null) return;
  if (p === ADMIN_PASSWORD) {
    userRole = 'admin';
    localStorage.setItem('izuv_role', 'admin');
    toast('כניסת מנהל ✅');
    applyRoleToNav();
    navigate('dashboard');
  } else {
    toast('סיסמה שגויה ❌');
  }
}

function exitAdmin() {
  userRole = 'secretary';
  localStorage.setItem('izuv_role', 'secretary');
  toast('מצב מזכירה');
  applyRoleToNav();
  navigate('orders');
}

let currentPage = (userRole === 'admin') ? 'dashboard' : 'orders';

function navigate(page) {
  if (!canSee(page)) page = 'orders';  // מזכירה לא יכולה להגיע לעמודים מוגבלים
  currentPage = page;
  document.querySelectorAll('#nav a').forEach(a => {
    a.classList.toggle('active', a.dataset.page === page);
  });
  render();
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-page]');
  if (a) { e.preventDefault(); navigate(a.dataset.page); }
});

function render() {
  const titles = {
    employees: 'ניהול עובדות',

    collection: 'ניהול גביה',
    work: 'מסך ניהול עבודה',
  };
  if (!canSee(currentPage)) currentPage = 'orders';  // אכיפת הרשאות
  applyRoleToNav();
  document.getElementById('page-title').textContent = titles[currentPage] || '';

  const content = document.getElementById('content');
  switch (currentPage) {
    case 'dashboard':   content.innerHTML = renderDashboard(); break;
    case 'orders':      content.innerHTML = renderOrders(); break;
    case 'new-order':   content.innerHTML = renderOrderForm(); break;
    case 'customers':   content.innerHTML = renderCustomers(); setTimeout(_renderCustPage, 0); break;
    case 'products':    content.innerHTML = renderProducts(); break;
    case 'collection':  content.innerHTML = renderCollection(); break;
    case 'work':        content.innerHTML = renderWork(); break;

    case 'reports':     content.innerHTML = renderReports(); break;
    default:            content.innerHTML = '<p>עמוד לא נמצא</p>';
  }
  bindEvents();
  renderTopbar();
  const _dt = document.getElementById('f-destType');

}

    <div class="tab ${statusFilter==='done'?'active':''}" onclick="window._orderFilter='done';render()">בוצע (${DB.orders.filter(o=>o.status==='done').length})</div>

function renderOrdersTable(orders) {
  return `<table>
    <tr><th>מס' הזמנה</th><th>לקוח</th><th>מוצר</th><th>תאריך משלוח</th><th>עיר</th><th>סטטוס</th><th>תשלום</th><th>סכום</th><th>פעולות</th></tr>
    ${orders.map(o => {
      const [sl, sc] = statusLabel(o.status);
      const [pl, pc] = payLabel(o.paymentStatus);
      return `<tr>
        <td><strong>${escHtml(o.orderNum)}</strong></td>
        <td>${escHtml(o.customerName)}</td>
        <td>${escHtml(o.productName)}</td>
        <td>${formatDate(o.deliveryDate)}</td>
        <td>${escHtml(o.city)}</td>
        <td>
          <select class="badge ${sc}" style="border:none;background:transparent;cursor:pointer;font-weight:600;font-size:12px;" onchange="updateOrderStatus(${o.id},this.value)">
            <option value="waiting" ${o.status==='waiting'?'selected':''}>ממתין</option>
            <option value="in-progress" ${o.status==='in-progress'?'selected':''}>בעבודה</option>
            <option value="done" ${o.status==='done'?'selected':''}>בוצע</option>
            <option value="closed" ${o.status==='closed'?'selected':''}>סגור</option>
            <option value="hesitant" ${o.status==='hesitant'?'selected':''}>מתלבט</option>
            <option value="not-interested" ${o.status==='not-interested'?'selected':''}>לא מעוניין</option>
          </select>
        </td>
        <td><span class="badge ${pc}">${pl}</span></td>
        <td>₪${o.totalPrice.toLocaleString()}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-outline btn-sm" onclick="showOrderDetails(${o.id})">👁 פרטים</button>
          <button class="btn btn-outline btn-sm" onclick="editOrder(${o.id})">✏️ ערוך</button>
          <button class="btn btn-gold btn-sm" onclick="showDeliveryLabel(${o.id})">📦 תעודה</button>
          ${!o.paymentDone ? `<button class="btn btn-primary btn-sm" onclick="markPaid(${o.id})">✅ שולם</button>` : ''}
        </td>
      </tr>`;
    }).join('')}
  </table>`;
}

function filterOrders() {
  const q = document.getElementById('order-search').value.toLowerCase();
  const statusFilter = window._orderFilter || 'all';
  let orders = [...DB.orders].sort((a,b) => b.id - a.id);
  if (statusFilter !== 'all') orders = orders.filter(o => o.status === statusFilter);
  if (q) orders = orders.filter(o =>
    o.customerName.toLowerCase().includes(q) ||
    o.orderNum.toLowerCase().includes(q) ||
    o.productName.toLowerCase().includes(q)
  );
  document.getElementById('orders-table-wrap').innerHTML = renderOrdersTable(orders);
}

function updateOrderStatus(id, status) {
  const o = DB.orders.find(o => o.id === id);
  if (o) { o.status = status; toast('סטטוס עודכן'); render(); }
}

function markPaid(id) {
  const o = DB.orders.find(o => o.id === id);
  if (o) { o.paymentDone = true; o.paymentStatus = 'paid'; toast('תשלום סומן ✅ — נשלחה חשבונית'); render(); }
}

// ===== CUSTOMER AUTOCOMPLETE =====
function custAutocomplete(q) {
  const dd = document.getElementById('cust-dropdown');
  if (!dd) return;
  if (!q || q.length < 2) { dd.style.display = 'none'; return; }
  const results = DB.customers
    .filter(c => c.name.includes(q) || (c.phone||'').includes(q))
    .slice(0, 15);
  if (results.length === 0) { dd.style.display = 'none'; return; }
  dd.innerHTML = results.map(c => `
    <div onclick="fillCustomer(${c.id})" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:14px;"
      onmouseover="this.style.background='#F0F6E8'" onmouseout="this.style.background='white'">
      <strong>${escHtml(c.name)}</strong>
      ${c.phone ? `<span style="color:var(--text-muted);font-size:12px;margin-right:8px">${escHtml(c.phone)}</span>` : ''}
      ${c.city ? `<span style="color:var(--text-muted);font-size:12px">${escHtml(c.city)}</span>` : ''}
      <span class="badge ${c.type==='institutional'?'badge-blue':'badge-green'}" style="float:left;font-size:11px">${c.type==='institutional'?'מוסדי':'פרטי'}</span>
    </div>`).join('');
  dd.style.display = 'block';
}

function fillCustomer(id) {
  const c = DB.customers.find(x => x.id === id);
  if (!c) return;
  // Fill form fields
  const parts = c.name.split(' ');
  const fn = document.getElementById('f-firstName');
  const ln = document.getElementById('f-lastName');
  const ph = document.getElementById('f-phone');
  const mb = document.getElementById('f-mobile');
  const ac = document.getElementById('cust-autocomplete');
  const dd = document.getElementById('cust-dropdown');
  if (fn) fn.value = parts[0] || '';
  if (ln) ln.value = parts.slice(1).join(' ') || '';
  if (ph) ph.value = c.phone || '';
  if (mb) mb.value = c.mobile || c.phone || '';
  if (ac) ac.value = c.name;
  if (dd) dd.style.display = 'none';
  // Also fill city
  const cityInput = document.querySelector('input[name="city"]');
  if (cityInput && c.city) cityInput.value = c.city;
  toast('לקוח נבחר: ' + c.name);
}

// Also: after submitting new order, offer print
const _origNavigateAfterOrder = navigate;

function updateProductPrice(sel) {
  const opt = sel.options[sel.selectedIndex];
  const price = opt.dataset.price || 0;
  const dp = document.getElementById('f-designPrice');
  if (dp) { dp.value = price; calcTotal(); }
}

function calcTotal() {
  const get = id => parseFloat(document.getElementById(id)?.value || 0);
  const total = get('f-designPrice') + get('f-kafe') + get('f-deliveryCost') + get('f-graphicsCost');
  const t = document.getElementById('f-total');
  if (t) t.textContent = total;
}

// בחירת יעד המשלוח — מציג את שדות היעד הנבחר ומבטל (disable) את השאר
// כך שרק שדות היעד הפעיל נשלחים בטופס (אין התנגשות שמות).
function setDest(type) {
  type = type || 'home';
  const h = document.getElementById('f-destType');
  if (h) h.value = type;
  document.querySelectorAll('.dest-btn').forEach(b => {
    const on = b.dataset.dest === type;
    b.classList.toggle('btn-primary', on);
    b.classList.toggle('btn-outline', !on);
  });
  document.querySelectorAll('.dest-group').forEach(g => {
    const on = g.dataset.dest === type;
    g.style.display = on ? 'contents' : 'none';
    g.querySelectorAll('input,select,textarea').forEach(el => { el.disabled = !on; });
  });
}

const DEST_LABELS = {pickup:'איסוף עצמי', home:'משלוח לבית', hotel:'משלוח למלון', hospital:'משלוח לבית חולים', hall:'משלוח לאולם'};
function destLabel(o) { return DEST_LABELS[o.destType] || 'משלוח לבית'; }
function destSummary(o) {
  const t = o.destType || 'home';
  const city = o.city || '';
  if (t === 'pickup')   return 'איסוף עצמי מהחנות';
  if (t === 'hotel')    return `מלון ${o.venueName||''}${o.address?', '+o.address:''}${o.houseNum?' '+o.houseNum:''}${o.floor?', קומה '+o.floor:''}${o.room?', חדר '+o.room:''}${city?', '+city:''}`;
  if (t === 'hospital') return `${o.venueName||''}${o.department?', מחלקה '+o.department:''}${o.floor?', קומה '+o.floor:''}${o.room?', חדר '+o.room:''}${city?', '+city:''}`;
  if (t === 'hall')     return `${o.venueName||''}${o.address?', '+o.address:''}${city?', '+city:''}`;
  return `${o.address||''}${o.houseNum?' '+o.houseNum:''}${o.apt?', דירה '+o.apt:''}${o.entrance?', כניסה '+o.entrance:''}${city?', '+city:''}`;
}

function submitOrder(e, editId) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const get = k => fd.get(k) || '';

  const productId = parseInt(get('productId'));
  const product = DB.products.find(p => p.id === productId);
  const paymentDone = get('paymentDone') === '1';
  const total = (parseFloat(get('designPrice'))||0) + (parseFloat(get('kafe'))||0) + (parseFloat(get('deliveryCost'))||0) + (parseFloat(get('graphicsCost'))||0);
  // תווית סוג הקאפה (מהאופציה הנבחרת בתפריט)
  const kafeSel = document.getElementById('f-kafe');
  const kafeType = (kafeSel && kafeSel.selectedOptions[0]) ? (kafeSel.selectedOptions[0].dataset.label || '') : '';
  // שדות חדשים
  const extraFields = {
    kafeType,
    kashrut: get('kashrut'),  // "מוצרים באריזה" — פרווה/חלבי, נבחר בכל הזמנה
    destType: get('destType'),
    venueName: get('venueName'),
    room: get('room'),
    floor: get('floor'),
    department: get('department'),
    houseNum: get('houseNum'),
    extraPhone: get('extraPhone'),
    saveForEnd: get('saveForEnd') === '1',
    setupAtEvent: get('setupAtEvent') === '1',
  };

  if (editId) {
    const idx = DB.orders.findIndex(o => o.id === editId);
    if (idx >= 0) {
      Object.assign(DB.orders[idx], {
        deliveryDate: get('deliveryDate'), deliveryTime: get('deliveryTime'), city: get('city'),
        firstName: get('firstName'), lastName: get('lastName'), phone: get('phone'), mobile: get('mobile'),
        customerType: get('customerType'), customerName: get('firstName')+' '+get('lastName'),
        productId, productName: product ? product.name : '',
        notes: get('notes'), blessing: get('blessing'),
        kafe: parseFloat(get('kafe'))||0, designPrice: parseFloat(get('designPrice'))||0,
        deliveryCost: parseFloat(get('deliveryCost'))||0, graphicsCost: parseFloat(get('graphicsCost'))||0,
        paymentMethod: get('paymentMethod'), paymentDone, totalPrice: total,
        paymentStatus: paymentDone ? 'paid' : 'pending',
        deliveryTo: get('deliveryTo'), address: get('address'), entrance: get('entrance'),
        floor: get('floor'), apt: get('apt'), neighborhood: get('neighborhood'),
        senderName: get('senderName'), senderPhone: get('senderPhone'), senderMobile: get('senderMobile'),
        receiverName: get('receiverName'), receiverPhone: get('receiverPhone'), receiverMobile: get('receiverMobile'),
        deliveryNotes: get('deliveryNotes'),
        ...extraFields,
      });
      toast('הזמנה עודכנה ✅');
    }
  } else {
    const newOrder = {
      id: DB.nextId, orderNum: genOrderNum(),
      customerId: null, customerName: get('firstName')+' '+get('lastName'),
      customerType: get('customerType'),
      deliveryDate: get('deliveryDate'), deliveryTime: get('deliveryTime'), city: get('city'),
      firstName: get('firstName'), lastName: get('lastName'), phone: get('phone'), mobile: get('mobile'),
      productId, productName: product ? product.name : '',
      notes: get('notes'), blessing: get('blessing'),
      kafe: parseFloat(get('kafe'))||0, designPrice: parseFloat(get('designPrice'))||0,
      deliveryCost: parseFloat(get('deliveryCost'))||0, graphicsCost: parseFloat(get('graphicsCost'))||0,
      paymentMethod: get('paymentMethod'), paymentDone, totalPrice: total,
      paymentStatus: paymentDone ? 'paid' : 'pending',
      deliveryTo: get('deliveryTo'), address: get('address'), entrance: get('entrance'),
      floor: get('floor'), apt: get('apt'), neighborhood: get('neighborhood'),
      senderName: get('senderName'), senderPhone: get('senderPhone'), senderMobile: get('senderMobile'),
      receiverName: get('receiverName'), receiverPhone: get('receiverPhone'), receiverMobile: get('receiverMobile'),
      deliveryNotes: get('deliveryNotes'),
      ...extraFields,
      status: 'waiting', colklarDone: false, fruitsDone: false, closeDone: false,
      createdAt: new Date().toISOString().slice(0,10),
    };
    DB.orders.push(newOrder);
    DB.nextId++;
    if (paymentDone) toast('הזמנה נוצרה ✅ — חשבונית הופקה');
    else toast('הזמנה נוצרה ✅ — עברה למעקב גביה');
    // Ask to print
    setTimeout(() => {
      if (confirm('הזמנה ' + newOrder.orderNum + ' נוצרה! להדפיס דף עבודה + תעודת משלוח?')) {
        printOrderAndDelivery(newOrder.id);
      }
    }, 300);
  }
  window._orderFilter = 'all';
  navigate('orders');
}

let _custPage = 0;
const CUST_PER_PAGE = 50;

function renderCustomers() {
  _custPage = 0;
  return `
  <div class="card">
    <div class="card-header">
      <h2>👥 לקוחות (${DB.customers.length.toLocaleString()})</h2>
      <button class="btn btn-primary btn-sm" onclick="showAddCustomer()">+ לקוח חדש</button>
    </div>
    <div class="search-bar">
      <input type="text" id="cust-search" placeholder="🔍 חיפוש שם / עיר / טלפון..." oninput="filterCustomers()">
      <select id="cust-type-filter" onchange="filterCustomers()">
        <option value="all">כל הסוגים</option>
        <option value="private">פרטי</option>
        <option value="institutional">מוסדי</option>
      </select>
    </div>
    <div id="cust-table-wrap"></div>
    <div id="cust-pagination" style="display:flex;gap:8px;justify-content:center;padding:14px;"></div>
  </div>`;
}

function _getFilteredCustomers() {
  const q = document.getElementById('cust-search')?.value?.toLowerCase() || '';
  const type = document.getElementById('cust-type-filter')?.value || 'all';
  let list = DB.customers;
  if (type !== 'all') list = list.filter(c => c.type === type);
  if (q) list = list.filter(c =>
    c.name.toLowerCase().includes(q) ||
    (c.phone||'').includes(q) ||
    (c.city||'').toLowerCase().includes(q)
  );
  return list;
}

function filterCustomers() {
  _custPage = 0;
  _renderCustPage();
}

function _renderCustPage() {
  const list = _getFilteredCustomers();
  const total = list.length;
  const pages = Math.ceil(total / CUST_PER_PAGE);
  const page = _custPage;
  const slice = list.slice(page * CUST_PER_PAGE, (page+1) * CUST_PER_PAGE);

  const tableWrap = document.getElementById('cust-table-wrap');
  const paginationEl = document.getElementById('cust-pagination');
  if (!tableWrap) return;

  tableWrap.innerHTML = `<p style="color:var(--text-muted);font-size:13px;padding:4px 0 10px">מציג ${slice.length} מתוך ${total.toLocaleString()} לקוחות</p>
  <div class="table-wrap"><table>
    <tr><th>שם</th><th>סוג</th><th>טלפון</th><th>עיר</th><th>הזמנות</th><th>פעולות</th></tr>
    ${slice.map(c => `<tr>
      <td><strong>${escHtml(c.name)}</strong></td>
      <td><span class="badge ${c.type==='institutional'?'badge-blue':'badge-green'}">${c.type==='institutional'?'מוסדי':'פרטי'}</span></td>
      <td>${escHtml(c.phone||'')}</td>
      <td>${escHtml(c.city||'')}</td>
      <td style="text-align:center">${c.orderCount||0}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="editCustomer(${c.id})">✏️</button>
        <button class="btn btn-red btn-sm" onclick="deleteCustomer(${c.id})">🗑</button>
      </td>
    </tr>`).join('')}
  </table></div>`;

  if (paginationEl) {
    let pg = '';
    if (page > 0) pg += `<button class="btn btn-outline btn-sm" onclick="_custPage=${page-1};_renderCustPage()">◀ קודם</button>`;
    pg += `<span style="padding:8px 12px;font-size:13px;color:var(--text-muted)">${page+1} / ${pages}</span>`;
    if (page < pages-1) pg += `<button class="btn btn-outline btn-sm" onclick="_custPage=${page+1};_renderCustPage()">הבא ▶</button>`;
    paginationEl.innerHTML = pg;
  }
}

function saveCustomer(e, id) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = { name: fd.get('name'), type: fd.get('type'), phone: fd.get('phone'), mobile: fd.get('mobile'), city: fd.get('city'), notes: fd.get('notes') };
  let saved;
  if (id) {
    const idx = DB.customers.findIndex(c => c.id === id);
    if (idx >= 0) { Object.assign(DB.customers[idx], data); saved = DB.customers[idx]; }
    toast('לקוח עודכן ✅');
  } else {
    saved = { id: DB.nextCustomerId++, ...data, createdAt: new Date().toISOString().slice(0,10) };
    DB.customers.push(saved);
    toast('לקוח נוסף ✅');

  if (saved) saveCustomerToGS(saved);
  saveToLocalStorage();
  closeModal(); render();

function deleteCustomer(id) {

  DB.customers = DB.customers.filter(c => c.id !== id);
  deleteRow_GS('deleteCustomer', id);
  saveToLocalStorage();
  toast('לקוח נמחק');
  render();
}

  const totalPaid = paid.reduce((s,o) => s+o.totalPrice, 0);

  return `
  <div class="stat-grid">
    <div class="stat-card red"><div class="label">ממתין לגביה</div><div class="value">₪${totalPending.toLocaleString()}</div></div>

    ${pending.length === 0
      ? '<p style="text-align:center;padding:20px;color:var(--text-muted)">אין גביות פתוחות 🎉</p>'
      : pending.map(o => `
        <div class="collect-row">

  const win = window.open('','_blank');
  const rows = [
    ['לקוח', escHtml(o.customerName)],
    ['מוצר', escHtml(o.productName)],
    ['מחיר עיצוב', '₪' + o.designPrice],
    ['קאפה', '₪' + o.kafe],
    ['משלוח', '₪' + o.deliveryCost],

    ['אמצעי תשלום', payMethodLabel(o.paymentMethod)],

  ].map(([k,v]) => '<div class="row' + (k==='סה"כ'?' total':'') + '"><span>' + k + ':</span><span>' + v + '</span></div>').join('');

    + '<h2>🍎 עיצוב בפרי</h2><p style="color:#999;font-size:12px;">קבלה מס\' ' + o.orderNum + '</p><hr>'
    + rows
    + '<p style="text-align:center;margin-top:30px;color:#B89A28;font-weight:700;">תודה על הקנייה! 🍎</p>'
    + '<scr' + 'ipt>window.print();window.close();</scr' + 'ipt></body></html>');
}

                  ${o.fruitsDone ? '✓' : ''}

}

function workToggle(id, field, label) {
  const o = DB.orders.find(x => x.id === id);
  if (!o) return;
  o[field] = !o[field];
  if (o[field] && field !== 'closeDone') {
    showStickerPopup(o);
  }
  if (o.colklarDone && o.fruitsDone && o.closeDone) {
    o.status = 'done';
    toast('הזמנה ' + o.orderNum + ' הושלמה ✅');
  }
  render();
}

function showStickerPopup(o) {
  const sticker = document.createElement('div');
  sticker.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;background:white;border:3px solid var(--green-mid);border-radius:12px;padding:20px 28px;box-shadow:0 8px 40px rgba(0,0,0,0.3);text-align:center;min-width:220px;';
  sticker.innerHTML = `
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">🖨 מדבקה</div>
    <div style="font-size:13px;color:var(--text-muted);">מק"ט</div>
    <div style="font-size:16px;font-weight:800;color:var(--green-dark);">${escHtml(o.productId ? DB.products.find(p=>p.id===o.productId)?.id || '' : '')}</div>
    <div style="font-size:13px;color:var(--text-muted);margin-top:8px;">מס' הזמנה</div>
    <div style="font-size:20px;font-weight:800;color:var(--green-dark);">${escHtml(o.orderNum)}</div>
    <div style="font-size:13px;color:var(--text-muted);margin-top:8px;">שם משפחה</div>

}

// ===================== REPORTS =====================
function renderReports() {
  const months = typeof MONTHLY_DATA !== 'undefined' ? MONTHLY_DATA : [];
  const totalRev = months.reduce((s,m) => s+m.revenue, 0);
  const totalOrders = months.reduce((s,m) => s+m.orders, 0);
  const maxRev = Math.max(...months.map(m => m.revenue), 1);

  // Group by year
  const byYear = {};
  for (const m of months) {
    const [mo, yr] = m.month.split('-');
    if (!byYear[yr]) byYear[yr] = {orders:0, revenue:0, months:[]};
    byYear[yr].orders += m.orders;
    byYear[yr].revenue += m.revenue;
    byYear[yr].months.push(m);
  }

  return `
  <div class="stat-grid">
    <div class="stat-card gold"><div class="label">סה"כ הכנסות</div><div class="value" style="font-size:20px">₪${Math.round(totalRev).toLocaleString()}</div></div>
    <div class="stat-card"><div class="label">סה"כ הזמנות</div><div class="value">${totalOrders.toLocaleString()}</div></div>
    <div class="stat-card blue"><div class="label">ממוצע חודשי</div><div class="value" style="font-size:20px">₪${months.length?Math.round(totalRev/months.length).toLocaleString():0}</div></div>
    <div class="stat-card"><div class="label">ממוצע להזמנה</div><div class="value" style="font-size:20px">₪${totalOrders?Math.round(totalRev/totalOrders).toLocaleString():0}</div></div>
  </div>

  <!-- שנתי -->
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px;">
    ${Object.entries(byYear).sort((a,b)=>b[0]-a[0]).map(([yr,d]) => `
      <div class="card" style="text-align:center">
        <div style="font-size:24px;font-weight:800;color:var(--green-dark)">${yr}</div>
        <div style="font-size:22px;font-weight:800;color:var(--gold)">₪${Math.round(d.revenue).toLocaleString()}</div>
        <div style="color:var(--text-muted);font-size:13px">${d.orders.toLocaleString()} הזמנות</div>
      </div>
    `).join('')}
  </div>

  <!-- חודשי -->
  <div class="card">
    <div class="card-header"><h2>📅 דוח חודשי</h2></div>
    ${months.length === 0 ? '<p style="text-align:center;color:var(--text-muted);padding:20px">אין נתונים</p>' : `
    <div style="padding:10px 0;">
      ${months.slice().reverse().map(m => {
        const bar = Math.round(m.revenue/maxRev*100);
        const [mo, yr] = m.month.split('-');
        const monthNames = {'1':'ינואר','2':'פברואר','3':'מרץ','4':'אפריל','5':'מאי','6':'יוני','7':'יולי','8':'אוגוסט','9':'ספטמבר','10':'אוקטובר','11':'נובמבר','12':'דצמבר'};
        return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);">
          <div style="min-width:100px;font-size:13px;font-weight:600">${monthNames[mo]||mo} ${yr}</div>
          <div style="min-width:60px;text-align:left;font-size:12px;color:var(--text-muted)">${m.orders} הזמנות</div>
          <div style="flex:1;background:#F0F0F0;border-radius:10px;height:12px;overflow:hidden;">
            <div style="width:${bar}%;background:var(--green-mid);height:100%;border-radius:10px;"></div>
          </div>
          <div style="min-width:90px;text-align:left;font-weight:700;color:var(--green-dark)">₪${Math.round(m.revenue).toLocaleString()}</div>
        </div>`;
      }).join('')}
    </div>`}
  </div>`;
}

// ===================== GOOGLE SHEETS API =====================
const GS_URL = 'https://script.google.com/macros/s/AKfycbz6dBqcvCFnEytOeQqCIPkDusaQ4ldMerWGafCFhAjAFVZO9GiLF4wAhy66SwwonRT_Ew/exec';

// Load data — needs response, use regular fetch (GAS has CORS headers for GET)
// Fetch with timeout to prevent hanging
async function fetchWithTimeout(url, timeout=10000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(url, {signal: ctrl.signal});
    clearTimeout(timer);
    return r;
  } catch(e) {
    clearTimeout(timer);
    throw e;
  }
}

async function gsGet(action) {
  try {
    const r = await fetchWithTimeout(`${GS_URL}?action=${action}`, 12000);
    if (r.ok) return await r.json();
  } catch(e) { console.warn('gsGet timeout/error:', e.message); }
  return null;
}

// Save via hidden form POST — most reliable cross-origin method
function gsSave(action, data) {
  try {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = GS_URL;
    form.target = '_gsframe'; // post to hidden iframe, no page navigation
    form.style.display = 'none';

    const addField = (name, val) => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = val;
      form.appendChild(input);
    };

    addField('action', action);
    addField('data', JSON.stringify(data));

    // Create hidden iframe if not exists
    if (!document.getElementById('_gsframe')) {
      const iframe = document.createElement('iframe');
      iframe.name = '_gsframe';
      iframe.id = '_gsframe';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
    }

    document.body.appendChild(form);
    form.submit();
    setTimeout(() => form.remove(), 3000);
  } catch(e) {
    console.warn('gsSave error:', e);
  }
}

async function gsPost(action, data) { return gsGet(action + '&data=' + encodeURIComponent(JSON.stringify(data))); }

function parseOrder(o) {
  return {...o, id:parseInt(o.id)||o.id,
    kafe:parseFloat(o.kafe)||0, designPrice:parseFloat(o.designPrice)||0,
    deliveryCost:parseFloat(o.deliveryCost)||0, graphicsCost:parseFloat(o.graphicsCost)||0,
    totalPrice:parseFloat(o.totalPrice)||0,
    paymentDone: o.paymentDone===true||o.paymentDone==='true'||o.paymentDone==='TRUE',
    colklarDone: o.colklarDone==='true'||o.colklarDone===true,
    fruitsDone: o.fruitsDone==='true'||o.fruitsDone===true,
    closeDone: o.closeDone==='true'||o.closeDone===true,
    saveForEnd: o.saveForEnd==='true'||o.saveForEnd===true||o.saveForEnd==='TRUE',
    setupAtEvent: o.setupAtEvent==='true'||o.setupAtEvent===true||o.setupAtEvent==='TRUE',
  };
}

async function loadFromGoogleSheets() {
  toast('⏳ טוען נתונים מ-Google Sheets...');
  try {
    const all = await gsGet('getAll');
    if (!all || all.error) { toast('⚠️ שגיאה בטעינה: ' + (all?.error||'timeout')); return; }

    let changed = false;

    // Orders
    if (all.orders?.length > 0) {
      DB.orders = all.orders.map(parseOrder);
      DB.nextId = Math.max(...DB.orders.map(o=>parseInt(o.id)||0), 1003) + 1;
      changed = true;
    }

    // Customers (new ones added via system)
    if (all.customers?.length > 0) {
      // Merge with existing — GS customers override
      DB._customers = all.customers;
      changed = true;
    }

    // Products
    if (all.products?.length > 0) {
      DB.products = all.products.map(p => ({...p, id:parseInt(p.id)||p.id, price:parseFloat(p.price)||0}));
      DB.nextProductId = Math.max(...DB.products.map(p=>parseInt(p.id)||0), 4) + 1;
      changed = true;
    }

    // Tasks
    if (all.tasks?.length > 0) {
      HISTORICAL.tasks = all.tasks;
      changed = true;
    }

    const msg = `✅ נטען: ${all.orders?.length||0} הזמנות, ${all.customers?.length||0} לקוחות, ${all.products?.length||0} מוצרים, ${all.tasks?.length||0} משימות`;
    toast(msg);
    if (changed) render();
  } catch(e) {
    toast('⚠️ שגיאת חיבור ל-Google Sheets');
    console.warn(e);
  }
}

function saveOrderToGS(order)    { gsSave('saveOrder', order); }
function saveCustomerToGS(cust)  { gsSave('saveCustomer', cust); }
function saveProductToGS(prod)   { gsSave('saveProduct', prod); }
function saveTasksToGS(tasks)    { gsSave('saveTasks', tasks); }
function deleteOrderFromGS(id)   { fetch(`${GS_URL}?action=deleteOrder&id=${id}`, {mode:'no-cors'}).catch(()=>{}); }

async function deleteOrderFromGS(id) {
  gsGet('deleteOrder&id=' + id).catch(()=>{});
}

// ===================== LOCAL STORAGE PERSISTENCE =====================
const LS_KEY = 'izuv_bapri_data';

function saveToLocalStorage() {
  try {
    const saved = {
      orders: DB.orders,
      customers: DB._customers || [],
      nextId: DB.nextId,
      nextCustomerId: DB.nextCustomerId,
    };
    localStorage.setItem(LS_KEY, JSON.stringify(saved));
  } catch(e) { console.warn('Save failed:', e); }
}

function loadFromLocalStorage() {
  // localStorage is only a TEMPORARY cache — Google Sheets is the source of truth
  // We skip localStorage to force loading from Google Sheets every time
  // This ensures all devices see the same data
  try { localStorage.removeItem(LS_KEY); } catch(e) {}
}

// Auto-save after any data change.
// NOTE: these MUST be assignments (X = function...), not `function X(){}` declarations.
// A second `function X(){}` would be hoisted and overwrite the original, so _origX
// would point at the wrapper itself → infinite recursion → saves silently crash.
const _origSubmitOrder = submitOrder;
const _origMarkPaid = markPaid;
const _origWorkToggle = workToggle;

submitOrder = function(e, editId) {
  _origSubmitOrder(e, editId);
  saveToLocalStorage();
  const order = editId ? DB.orders.find(o=>o.id==editId) : DB.orders[DB.orders.length-1];
  if (order) saveOrderToGS(order);
};
markPaid = function(id) {
  _origMarkPaid(id);
  saveToLocalStorage();
  const order = DB.orders.find(o=>o.id===id);
  if (order) saveOrderToGS(order);
};
workToggle = function(id, field, label) {
  _origWorkToggle(id, field, label);
  saveToLocalStorage();
  const order = DB.orders.find(o=>o.id===id);
  if (order) saveOrderToGS(order);
};
function updateOrderStatus(id, status) {
  const o = DB.orders.find(o=>o.id===id);
  if (o) { o.status=status; toast('סטטוס עודכן'); saveOrderToGS(o); render(); }
}

loadFromGoogleSheets();
navigate(currentPage);      // קובע עמוד התחלתי + מסמן בתפריט + מצייר טופבר
